# Sitio estático; los datos se generan en la máquina local y llegan por rsync a ./web.
services:
  grifos:
    image: caddy:latest
    container_name: grifos
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
    expose:
      - "80"
    networks:
      - homebox_default
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  grifos-api:
    image: python:3.13-alpine
    container_name: grifos-api
    restart: unless-stopped
    command: python -u /app/app.py
    user: "1000:1000"
    volumes:
      - ./api/app.py:/app/app.py:ro
      - ./web:/web:ro
      - ./api-data:/data
    expose:
      - "8000"
    networks:
      - homebox_default
    mem_limit: 48m
    cpus: 0.25
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

networks:
  homebox_default:
    external: true
